services:
  sala:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"

  # Proxy HTTPS automático (Let's Encrypt). Edite o Caddyfile com o seu domínio.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - sala

volumes:
  caddy_data:
